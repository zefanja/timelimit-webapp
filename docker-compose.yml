# Production stack for Portainer: web app (+ API proxy), timelimit-server, PostgreSQL.
# The current timelimit-server supports PostgreSQL only (UTF-8 database).
# Put an HTTPS reverse proxy (Traefik, Caddy, Nginx Proxy Manager, …) in front
# of the "web" service. Use the same public URL in the web app AND on the child
# phones (TimeLimit → vernetzter Modus → eigener Server).
#
# Required: set the variables below (e.g. as Portainer stack environment).

services:
  web:
    build: .
    # or: image: ghcr.io/<you>/timelimit-webapp:latest
    restart: unless-stopped
    environment:
      TIMELIMIT_UPSTREAM: http://timelimit:8080
    ports:
      - "${WEB_PORT:-8181}:80"
    depends_on:
      - timelimit

  timelimit:
    # unmodified upstream server, built from source
    build: https://codeberg.org/timelimit/timelimit-server.git
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://timelimit:${DB_PASSWORD:?DB_PASSWORD fehlt}@db:5432/timelimit
      MAIL_SENDER: ${MAIL_SENDER:?MAIL_SENDER fehlt}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:?MAIL_TRANSPORT fehlt}
      MAIL_WHITELIST: ${MAIL_WHITELIST:-}
      DISABLE_SIGNUP: ${DISABLE_SIGNUP:-no}
      ALWAYS_PRO: ${ALWAYS_PRO:-yes}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # needed (together with ADMIN_TOKEN) for unlocking premium from the web app
      SIGN_SECRET: ${SIGN_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: timelimit
      POSTGRES_USER: timelimit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - timelimit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelimit -d timelimit"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  timelimit-db:
