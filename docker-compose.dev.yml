# Test environment: timelimit-server in development mode (login codes are
# printed to the server log instead of being mailed) + PostgreSQL.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f timelimit   # login codes
#   npm run dev                                                  # web app on http://localhost:5173
#
# The vite dev server proxies the API to http://localhost:8080
# (override with TIMELIMIT_SERVER=...).

services:
  timelimit:
    build: https://codeberg.org/timelimit/timelimit-server.git
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://timelimit:timelimit@db:5432/timelimit
      ADMIN_TOKEN: dev-admin-token
      SIGN_SECRET: dev-sign-secret
      # ALWAYS_PRO: "yes"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timelimit
      POSTGRES_USER: timelimit
      POSTGRES_PASSWORD: timelimit
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelimit -d timelimit"]
      interval: 5s
      timeout: 5s
      retries: 20
